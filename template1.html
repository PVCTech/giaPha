<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gia Phả Tộc Nguyễn - 5 Đời</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 40px; }
        .container { display: inline-block; min-width: 100%; text-align: center; }
        
        /* Cấu trúc cây */
        .tree ul {
            padding-top: 20px; position: relative;
            display: flex; justify-content: center;
        }
        .tree li {
            float: left; text-align: center; list-style-type: none;
            position: relative; padding: 20px 5px 0 5px;
        }

        /* Đường kẻ nối */
        .tree li::before, .tree li::after {
            content: ''; position: absolute; top: 0; right: 50%;
            border-top: 2px solid #888; width: 50%; height: 20px;
        }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #888; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #888; border-radius: 0 5px 0 0; }
        .tree li:first-child::after { border-radius: 5px 0 0 0; }
        .tree ul ul::before {
            content: ''; position: absolute; top: 0; left: 50%;
            border-left: 2px solid #888; width: 0; height: 20px;
        }

        /* Thẻ thành viên */
        .node {
            border: 1px solid #ccc; padding: 10px;
            background: #fff; border-radius: 5px;
            display: inline-block; width: 120px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative; transition: 0.3s;
        }
        .node:hover { transform: scale(1.05); border-color: #2980b9; z-index: 10; }
        
        .name { font-weight: bold; font-size: 13px; color: #2c3e50; }
        .meta { font-size: 10px; color: #7f8c8d; margin-top: 4px; }

        /* Phân loại màu theo đời */
        .d1 { border-top: 4px solid #e74c3c; background: #fdedec; }
        .d2 { border-top: 4px solid #e67e22; background: #fef5e7; }
        .d3 { border-top: 4px solid #f1c40f; background: #fef9e7; }
        .d4 { border-top: 4px solid #2ecc71; background: #e9f7ef; }
        .d5 { border-top: 4px solid #3498db; background: #ebf5fb; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SƠ ĐỒ GIA TỘC PHƯƠNG NAM</h1>
        <div class="tree" id="gia-pha"></div>
    </div>

    <script>
        // Danh sách dữ liệu mẫu để trộn tên
        const ho = ["Nguyễn", "Trần", "Lê", "Phạm", "Vũ"];
        const dem = ["Văn", "Thị", "Hữu", "Đức", "Minh", "Anh", "Bảo"];
        const ten = ["Tùng", "Sơn", "Linh", "Hà", "Tuấn", "Hùng", "Hến", "Phương", "Cường", "Lan", "Huệ", "An", "Phúc"];

        function layTenNgauNhien() {
            return `${ho[Math.floor(Math.random()*ho.length)]} ${dem[Math.floor(Math.random()*dem.length)]} ${ten[Math.floor(Math.random()*ten.length)]}`;
        }

        // 1. Tạo dữ liệu đệ quy cho 100 người
        let count = 0;
        function generateData(level) {
            count++;
            const node = {
                name: count === 1 ? "Cụ Tổ Nguyễn Văn A" : layTenNgauNhien(),
                level: level,
                children: []
            };

            // Điều kiện để đạt xấp xỉ 100 người trong 5 đời
            if (level < 5) {
                // Đời 1: 4 con, Đời 2: 3 con, Đời 3: 2 con, Đời 4: 2 con
                let numChildren = 0;
                if (level === 1) numChildren = 4;
                else if (level === 2) numChildren = 3;
                else if (level === 3) numChildren = 2;
                else if (level === 4) numChildren = 2;

                for (let i = 0; i < numChildren; i++) {
                    node.children.push(generateData(level + 1));
                }
            }
            return node;
        }

        const familyData = generateData(1);

        // 2. Hàm vẽ HTML đệ quy
        function renderHTML(person) {
            let html = `<li>`;
            html += `
                <div class="node d${person.level}">
                    <div class="name">${person.name}</div>
                    <div class="meta">Đời thứ ${person.level}</div>
                </div>`;

            if (person.children.length > 0) {
                html += `<ul>`;
                person.children.forEach(child => {
                    html += renderHTML(child);
                });
                html += `</ul>`;
            }
            html += `</li>`;
            return html;
        }

        // Hiển thị ra màn hình
        document.getElementById('gia-pha').innerHTML = `<ul>${renderHTML(familyData)}</ul>`;
        console.log("Tổng số thành viên:", count);
    </script>
</body>
</html>
